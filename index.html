<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>RateMates ist umgezogen</title>
<script>
  // Alten Service Worker und seine Zwischenspeicher entfernen, dann weiterleiten.
  // Suchparameter und Anker (z. B. Einladungslinks #friend=…) bleiben erhalten.
  (async () => {
    try {
      if ("serviceWorker" in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map((r) => r.unregister()));
      }
      if ("caches" in window) {
        const keys = await caches.keys();
        await Promise.all(keys.map((k) => caches.delete(k)));
      }
      // Alte Anmeldedaten von RateMates auf dieser Adresse löschen (die neue Adresse
      // ist eine eigene Herkunft, dort meldet man sich neu an)
      try { localStorage.removeItem("rmg_user"); localStorage.removeItem("rm_city"); } catch (e) {}
      if ("indexedDB" in window) indexedDB.deleteDatabase("firebaseLocalStorageDb");
    } catch (e) { /* Weiterleitung trotzdem */ }
    location.replace("https://ratemates.web.app/" + location.search + location.hash);
  })();
</script>
<noscript><meta http-equiv="refresh" content="0; url=https://ratemates.web.app/"></noscript>

</head>
<body>
<p>RateMates ist umgezogen.<br>Weiter zu <a href="https://ratemates.web.app/">ratemates.web.app</a></p>
</body>
</html>
